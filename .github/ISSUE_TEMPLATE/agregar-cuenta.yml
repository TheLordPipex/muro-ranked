name: Agregar cuenta
description: Sumá una cuenta (tuya o un smurf) al Muro de Ranked.
title: "Agregar cuenta"
labels: ["agregar-cuenta"]
body:
  - type: input
    id: riot_id
    attributes:
      label: Riot ID
      description: Tal cual aparece en el cliente, con el tag. Ejemplo ONU yamizang#1312
      placeholder: "Nombre#TAG"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Solo cuentas de **LAN**. En unos minutos la cuenta aparece en la lista de la página y te respondo acá con tu link.
        Si no sos el dueño del repositorio, el pedido queda esperando su aprobación.
